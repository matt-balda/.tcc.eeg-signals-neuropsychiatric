[project]
name = "BrainDx"
version = "0.0.1"
description = " "
readme = "README.md"
requires-python = ">=3.12,<3.13"

authors = [
    { name = "Mateus Balda Mota" },
    { name = "Alessandro Bof de Oliveira" }
]

dependencies = [
    "numpy>=2.1.2",
    "pandas>=2.2.3",
    "matplotlib>=3.9.2",
    "jupyterlab>=4.2.5",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.2",
    "mne>=1.8.0",
    "plotly>=5.24.1",
    "imbalanced-learn>=0.12.4",
]

[dependency-groups]
dev = [
    "black>=25.0.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.15.16",
    "pre-commit>=4.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"